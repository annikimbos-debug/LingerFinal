html,body{height:100%;margin:0}
body{background:var(--bg);display:grid;place-items:center;overflow:hidden;transition:background 1s}
svg{width:min(96vw,calc(88vh*800/520));height:auto;display:block;border-radius:18px;box-shadow:0 20px 60px rgba(20,10,50,.35);touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#mb{cursor:pointer;outline:none}#mb .bg{transition:transform .25s;transform-box:fill-box;transform-origin:center}#mb:hover .bg{transform:scale(1.1)}#mb .led{transition:fill .3s}#mb.on .led{fill:#ffd27a}
#mb:focus-visible .rg{opacity:.9;animation:none}
.spin{transform-box:fill-box;transform-origin:center}#mb.on .spin{animation:sp 4s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
#mb .hy{display:none}#mb.on .hy{display:inline}#mb.on .ey{display:none}
#mb .nt{opacity:0}#mb.on .nt{animation:nt 3s ease-out infinite}@keyframes nt{0%{opacity:0;transform:translateY(0)}20%{opacity:.9}100%{opacity:0;transform:translateY(-18px)}}


#mb:not(.on) .rg{animation:mp 3s ease-in-out infinite}
.rg{transform-box:fill-box;transform-origin:center;opacity:0}@keyframes mp{0%,100%{transform:scale(1);opacity:0}50%{transform:scale(1.15);opacity:.55}}
@media (prefers-reduced-motion:reduce){#mb:not(.on) .rg,#mb.on .spin,#mb.on .nt{animation:none}}
.hot{fill:transparent;cursor:pointer}
.off{pointer-events:none}
.pose{opacity:0;transition:opacity .35s}
.pose.on{opacity:1;animation:hop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes hop{0%{transform:translateY(-26px) scale(.9,1.1)}60%{transform:translateY(0) scale(1.08,.92)}100%{transform:none}}
.br{transform-box:fill-box;transform-origin:50% 100%;animation:br 4.5s ease-in-out infinite}
@keyframes br{50%{transform:scale(1.015,1.03)}}
.ghost{animation:gl 3.2s ease-in-out infinite;pointer-events:none}
@keyframes gl{0%,100%{opacity:.08}50%{opacity:.7}}
.tw{animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}
.puff{animation:pf .9s ease-out forwards}
@keyframes pf{to{transform:translate(var(--dx),var(--dy));opacity:0}}
.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}
@keyframes sw{50%{transform:rotate(7deg)}}
.gf{opacity:.12;animation:gb 2.6s ease-in-out infinite;filter:drop-shadow(0 0 5px #ffe39a);transition:opacity .25s,transform .25s}
@keyframes gb{0%,100%{opacity:.06;transform:translateY(0)}50%{opacity:.2;transform:translateY(-5px)}}
.gf *{fill:#fff3c4!important}.gf [fill="none"]{fill:none!important}.gf [stroke]{stroke:#fff3c4!important}
.gf.hv{animation:none;opacity:.45;transform:translateY(-8px)}
.rs{animation:rs 9s ease-in-out infinite}
@keyframes rs{50%{opacity:.6}}
.mote{animation:mote 10s ease-in-out infinite}
@keyframes mote{0%,100%{transform:translate(0,0);opacity:0}50%{transform:translate(var(--mx),var(--my));opacity:.75}}
.fl{animation:fl 4s ease-in-out infinite}
@keyframes fl{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.rs,.mote,.fl{animation:none}.mote{opacity:.4}}
@media (prefers-reduced-motion:reduce){.br,.ghost,.tw,.sw,.gf{animation:none}.ghost{opacity:.4}.gf{opacity:.15}}
</style>

var K=[[0,'#b5d7ee','#fde6e0','#ffffff',1,1,0],[.34,'#b5d7ee','#fde6e0','#ffffff',1,1,0],[.48,'#c9a6dd','#ffc09a','#ffc9d3',.78,.35,0],[.6,'#2a2a5c','#7b6fae','#b4a9d8',.5,0,1],[.88,'#2a2a5c','#7b6fae','#b4a9d8',.5,0,1],[.96,'#f4a9b6','#ffe3c8','#ffe9dc',.85,.4,.3],[1,'#b5d7ee','#fde6e0','#ffffff',1,1,0]];
